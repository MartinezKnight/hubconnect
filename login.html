<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — HubConnect</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">

<div class="auth-container">
  
  <!-- Left: Hero -->
  <div class="auth-hero">
    <img src="HC-Logo.png" alt="HubConnect" class="auth-hero-logo">
    <h1 class="auth-hero-title">Welcome<br><span>Back</span></h1>
    <p class="auth-hero-subtitle">Sign in to access your account and pools. Continue saving on transport, food, housing, and more.</p>
    <div class="auth-stats">
      <div class="stat"><div class="num">120+</div><div class="label">Active Pools</div></div>
      <div class="stat"><div class="num">50K+</div><div class="label">Members</div></div>
      <div class="stat"><div class="num">₦2.4B</div><div class="label">Pooled Together</div></div>
      <div class="stat"><div class="num">70%</div><div class="label">Avg. Savings</div></div>
    </div>
  </div>

  <!-- Right: Form -->
  <div class="auth-form-wrapper">
    
    <!-- Mobile logo -->
    <div class="auth-mobile-logo">
      <a href="index.html"><img src="HC-Logo.png" alt="HubConnect"></a>
    </div>

    <div class="auth-form-container">
      <h1>Welcome Back</h1>
      <p class="auth-subtitle">Sign in to access your account and pools</p>

      <form id="login-form" class="auth-form" novalidate>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="password-field">
            <input type="password" id="password" placeholder="••••••••••••" required autocomplete="current-password">
            <button type="button" class="password-toggle" id="toggle-pw">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group" style="text-align:right;margin-bottom:32px">
          <a href="reset-password.html" style="color:var(--lime);font-size:14px;font-weight:600">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-lime" id="login-btn">Sign In</button>
      </form>

      <p class="auth-footer-text">Don't have an account? <a href="signup.html">Create account</a></p>
    </div>
  </div>

</div>

<script>
const API_BASE='https://hubconnect-backend.onrender.com/api';function showToast(m,t='success'){document.querySelectorAll('.toast').forEach(e=>e.remove());const e=document.createElement('div');e.className=`toast ${t}`;e.textContent=m;document.body.appendChild(e);setTimeout(()=>{e.style.opacity='0';setTimeout(()=>e.remove(),400)},4e3)}if(localStorage.getItem('hc_token'))window.location.href='dashboard.html';const pw=document.getElementById('password'),tog=document.getElementById('toggle-pw');let vis=!1;tog.addEventListener('click',()=>{vis=!vis;pw.type=vis?'text':'password';tog.innerHTML=vis?'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>':'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>'});document.getElementById('login-form').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('login-btn'),email=document.getElementById('email').value.trim(),pass=document.getElementById('password').value;if(!email){showToast('Please enter email.','error');return}if(!pass){showToast('Please enter password.','error');return}btn.textContent='Signing in…';btn.disabled=!0;try{const res=await fetch(`${API_BASE}/auth/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})}),data=await res.json();if(res.ok){localStorage.setItem('hc_token',data.data.token);localStorage.setItem('hc_user',JSON.stringify(data.data.user));showToast('Welcome back! 👋');setTimeout(()=>window.location.href='dashboard.html',1200)}else{showToast(data.message||'Login failed.','error');btn.textContent='Sign In';btn.disabled=!1}}catch{showToast('Network error.','error');btn.textContent='Sign In';btn.disabled=!1}});
</script>

</body>
</html>
