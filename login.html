<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — HubConnect</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        body { display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; margin: 0; }
        .hero-side {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 80px 60px;
            overflow: hidden;
            min-height: 100vh;
        }
        .hero-side::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(6, 8, 26, 0.6), rgba(6, 8, 26, 0.8)),
                        url('hero-image.png');
            background-size: cover;
            background-position: center;
            filter: blur(8px);
            transform: scale(1.1);
            z-index: 0;
        }
        .hero-content {
            position: relative;
            z-index: 1;
        }
        .form-side { background: var(--navy); display: flex; align-items: center; justify-content: center; padding: 60px 40px; }

        /* MOBILE: hide hero, show only form */
        @media (max-width: 960px) {
            body { grid-template-columns: 1fr; }
            .hero-side { display: none; }
            .form-side { padding: 40px 24px; align-items: flex-start; }

            /* Mobile logo shown above form */
            .mobile-logo { display: block; margin-bottom: 32px; }
            .mobile-logo img { height: 40px; }
        }
        @media (min-width: 961px) {
            .mobile-logo { display: none; }
        }
    </style>
</head>
<body>

<div class="hero-side">
    <div class="hero-content">
        <img src="HC-Logo.png" alt="HubConnect" style="width: 160px; margin-bottom: 48px;">
        <h1 style="font-family: 'Syne', sans-serif; font-size: 48px; font-weight: 800; line-height: 1.1; margin-bottom: 24px;">Save Up To<br><span style="color: var(--lime);">70% on Everything</span></h1>
        <p style="font-size: 18px; color: var(--muted); line-height: 1.7; max-width: 480px;">Join 50,000+ Africans pooling resources to access life-changing opportunities.</p>
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 60px; max-width: 500px;">
            <div><div style="font-family: 'Syne'; font-size: 32px; font-weight: 800; color: var(--lime);">50K+</div><div style="font-size: 13px; color: var(--muted);">Active Users</div></div>
            <div><div style="font-family: 'Syne'; font-size: 32px; font-weight: 800; color: var(--lime);">70%</div><div style="font-size: 13px; color: var(--muted);">Avg Savings</div></div>
            <div><div style="font-family: 'Syne'; font-size: 32px; font-weight: 800; color: var(--lime);">3</div><div style="font-size: 13px; color: var(--muted);">Cities</div></div>
        </div>
    </div>
</div>

<div class="form-side">
    <div style="width: 100%; max-width: 440px;">

        <!-- Mobile logo -->
        <div class="mobile-logo">
            <a href="index.html"><img src="HC-Logo.png" alt="HubConnect"></a>
        </div>

        <div style="margin-bottom: 40px;">
            <h2 style="font-family: 'Syne', sans-serif; font-size: 32px; font-weight: 800; margin-bottom: 12px;">Welcome Back</h2>
            <p style="color: var(--muted); font-size: 15px;">Sign in to access your account</p>
        </div>

        <form id="login-form" novalidate>
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" id="email" class="form-input" placeholder="you@example.com" required autocomplete="email" style="font-size: 15px; padding: 14px 18px;">
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <div style="position:relative;">
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password" style="font-size: 15px; padding: 14px 48px 14px 18px;">
                    <button type="button" id="toggle-pw" aria-label="Toggle password" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);display:flex;align-items:center;padding:4px;">
                        <svg id="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div style="text-align:right; margin-bottom: 20px;">
                <a href="forgot-password.html" style="font-size:13px; color:var(--muted); text-decoration:none;">Forgot password?</a>
            </div>
            <button type="submit" id="login-btn" class="btn btn-lime" style="width: 100%; padding: 14px; font-size: 15px;">Sign In</button>
            <p style="text-align: center; margin-top: 32px; font-size: 14px; color: var(--muted);">
                Don't have an account? <a href="signup.html" style="color: var(--lime); font-weight: 600;">Create account</a>
            </p>
        </form>
    </div>
</div>

<script>
const API='https://hubconnect-backend.onrender.com/api';
function showToast(m,t='success'){document.querySelectorAll('.toast').forEach(e=>e.remove());const e=document.createElement('div');e.className=`toast ${t}`;e.textContent=m;document.body.appendChild(e);setTimeout(()=>{e.style.opacity='0';setTimeout(()=>e.remove(),400)},4000)}
if(localStorage.getItem('hc_token'))window.location.href='dashboard.html';

// Password toggle — clean SVG only
let vis=false;
const pwInput=document.getElementById('password');
const eyeIcon=document.getElementById('eye-icon');
document.getElementById('toggle-pw').addEventListener('click',()=>{
    vis=!vis;
    pwInput.type=vis?'text':'password';
    eyeIcon.innerHTML=vis
        ?'<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
        :'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
});

document.getElementById('login-form').addEventListener('submit',async e=>{
    e.preventDefault();
    const btn=document.getElementById('login-btn');
    const email=document.getElementById('email').value.trim();
    const pass=document.getElementById('password').value;
    if(!email){showToast('Please enter your email.','error');return}
    if(!pass){showToast('Please enter your password.','error');return}
    btn.textContent='Signing in…';btn.disabled=true;
    try{
        const res=await fetch(`${API}/auth/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})});
        const data=await res.json();
        if(res.ok){
            localStorage.setItem('hc_token',data.data.token);
            localStorage.setItem('hc_user',JSON.stringify(data.data.user));
            showToast('Welcome back! 👋');
            setTimeout(()=>window.location.href='dashboard.html',1200);
        }else{
            showToast(data.message||'Login failed.','error');
            btn.textContent='Sign In';btn.disabled=false;
        }
    }catch{
        showToast('Network error. Please try again.','error');
        btn.textContent='Sign In';btn.disabled=false;
    }
});
</script>
</body>
</html>
